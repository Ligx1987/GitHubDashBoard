name: sync-github-data

# Actions GITHUB_TOKEN normally has 1,000 core requests/hour per repository.
# Batches resume by oldest fetchedAt. Actual response headers control the quota;
# search has its own budget. No job waits for a quota window to reset.
on:
  schedule:
    - cron: "17 */2 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: github-data-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Collect a bounded batch and discover new repositories
        id: collect
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/sync-github-data.mjs --discover --limit 750 --budget 800 --discovery-pages 2
      - name: Save collection artifacts
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: github-data-${{ github.run_id }}
          path: |
            src/data/github-snapshot.json
            src/data/star-history.json
          retention-days: 7
      - name: Commit and push collected data
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/github-snapshot.json src/data/star-history.json
          if git diff --cached --quiet; then
            echo "No data changed."
            exit 0
          fi
          git commit -m "chore: collect GitHub metadata and star history [skip ci]"
          git push
