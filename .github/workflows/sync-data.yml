name: sync-github-data

# Refresh seed stats (stars/forks/open issues) from GitHub once a day and
# commit the result. Only runs on the default branch; use "Run workflow" for
# a manual sync. GITHUB_TOKEN is auto-provisioned (5000 API requests/hour,
# plenty for the 215 seeded repos).
on:
  schedule:
    - cron: "42 16 * * *" # 00:42 Beijing time, off the busy :00 mark
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 20
      - name: Sync seed stats with GitHub
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/sync-github-data.mjs
      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/github-data.js src/data/star-history.json
          git commit -m "chore: sync seed stats from GitHub [skip ci]" || exit 0
          git push
